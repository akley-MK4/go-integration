apiVersion: v1
kind: Service
metadata:
  name: {{ include "go-integration.fullname" . }}
  labels:
    {{- include "go-integration.labels" . | nindent 4 }}
spec:
  type: NodePort
  ports:
    - port: 22
      nodePort: 30005
      targetPort: 22
      protocol: TCP
      name: ssh
  selector:
    {{- include "go-integration.selectorLabels" . | nindent 4 }}
